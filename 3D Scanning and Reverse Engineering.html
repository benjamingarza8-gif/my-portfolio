<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arcade Machine 3D Models – Benjamin Garza</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    .model-3d-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 2rem auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      background: #000;
      aspect-ratio: 16 / 9;
    }
    .model-3d-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .model-title {
      text-align: center;
      margin: 1rem 0 0.5rem;
      font-size: 1.3rem;
      color: #333;
    }
    @media (max-width: 768px) {
      .model-3d-container { aspect-ratio: 4 / 3; }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <h1><a href="index.html" style="color:white; text-decoration:none;">← Back to Portfolio</a></h1>
    </div>
  </header>

  <section class="container" style="padding-top:2rem;">
    <h2>3D Scanning/Reverse Engineering</h2>
    <p><strong>Tools:</strong> SOLIDWORKS, Revopoint 3D Scanner, 3D Printing</p>

    <!-- Model 1: Bottom Right Support -->
    <div class="model-title">BMW Door Light Diffuser</div>
    <div class="model-3d-container">
      <iframe title="Bottom Right Support"
              allowfullscreen
              allow="autoplay; fullscreen; xr-spatial-tracking"
              src="https://sketchfab.com/models/fb47a976cb0844f4962c48f993d7a7e8/embed?ui_theme=dark&autostart=1&camera=0&ui_controls=0&ui_infos=0&ui_hint=0&ui_stop=0&transparent=1&preload=1"
              loading="lazy"></iframe>
    </div>

    

    <br><br>

    <p><a href="index.html" class="btn">Back to Portfolio</a></p>
  </section>

  <footer>
    <div class="container">
      <p>© 2025 Benji. Built with HTML & CSS.</p>
    </div>
  </footer>

</body>

</html>
